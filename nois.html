<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora de Regra de Três</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 500px;
      margin: 40px auto;
      padding: 20px;
      border: 1px solid #ddd;
      border-radius: 8px;
    }

    .campo {
      margin-bottom: 12px;
    }

    input {
      padding: 8px;
      width: 100%;
      margin-top: 4px;
      box-sizing: border-box;
    }

    button {
      padding: 10px 15px;
      cursor: pointer;
      margin-top: 10px;
    }

    #resultado {
      margin-top: 16px;
      font-weight: bold;
      color: #1f5f3f;
    }
  </style>
</head>
<body>
  <h2>Calculadora de Regra de Três</h2>

  <div class="campo">
    <label for="a">Valor A</label>
    <input type="number" id="a" placeholder="Digite o valor de A" step="any">
  </div>

  <div class="campo">
    <label for="b">Valor B</label>
    <input type="number" id="b" placeholder="Digite o valor de B" step="any">
  </div>

  <div class="campo">
    <label for="c">Valor C</label>
    <input type="number" id="c" placeholder="Digite o valor de C" step="any">
  </div>

  <button type="button" id="calcularBtn">Calcular</button>

  <p id="resultado">O resultado aparecerá aqui.</p>

  <script>
    function calcularRegraDeTres() {
      const a = parseFloat(document.getElementById('a').value);
      const b = parseFloat(document.getElementById('b').value);
      const c = parseFloat(document.getElementById('c').value);
      const resultado = document.getElementById('resultado');

      if ([a, b, c].some((valor) => Number.isNaN(valor))) {
        resultado.textContent = 'Preencha todos os campos com valores válidos.';
        return;
      }

      if (a === 0) {
        resultado.textContent = 'O valor de A não pode ser zero.';
        return;
      }

      const x = (b * c) / a;
      resultado.textContent = `O valor de x é: ${x.toFixed(2)}`;
    }

    document.getElementById('calcularBtn').addEventListener('click', calcularRegraDeTres);
  </script>
</body>
</html>
