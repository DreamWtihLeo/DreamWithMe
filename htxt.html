<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="htmx-config" content='{"selfRequestsOnly":false}'>
    <script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.7/dist/htmx.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/htmx-ext-json-enc@2.0.1/json-enc.js"></script>
    <title>Teste HTMX</title>
</head>
<body hx-ext="json-enc">
    <div hx-get="https://ola-tp1.onrender.com/" hx-trigger="mouseover" hx-swap="afterend">
        Carregando dados de uma API externa...
    </div>
    <h1 id="teste"></h1>
    <button hx-get="https://ola-tp1.onrender.com/" hx-trigger="click" hx-swap="innerHTML">
        Click Me
    </button>
</body>
</html>
